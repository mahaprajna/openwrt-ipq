name: Build AX3600 Qosmio 24.10-nss BIGPART NSS+iStore
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Create 4G Swap
        run: |
          sudo dd if=/dev/zero of=/home/runner/swapfile bs=1M count=4096
          sudo chmod 600 /home/runner/swapfile
          sudo mkswap /home/runner/swapfile
          sudo swapon /home/runner/swapfile
          free -h

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: 24.10-nss

      - name: Cache OpenWrt build
        uses: actions/cache@v4
        with:
          path: |
            dl
            build_dir
            staging_dir
          key: qosmio-2410-nss-${{ hashFiles('feeds.conf.default') }}
          restore-keys: |
            qosmio-2410-nss-

      - name: Add iStore feed source
        run: |
          sed -i '/istore/d' feeds.conf.default
          echo 'src-git istore https://github.com/linkease/istore;main' >> feeds.conf.default
          cat feeds.conf.default

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-pip python3-setuptools python3-dev rsync unzip wget zlib1g-dev

      - name: Update feeds & install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ========== 关键：禁用 ECM bond 支持 ==========
      - name: Disable ECM bond support
        run: |
          cd feeds/nss_packages/qca-nss-ecm
          echo "===== 修改前 ====="
          grep -n "ECM_INTERFACE_BOND_ENABLE" Makefile || true
          sed -i 's/ECM_INTERFACE_BOND_ENABLE=y/ECM_INTERFACE_BOND_ENABLE=n/g' Makefile
          sed -i 's/ECM_INTERFACE_BOND_ENABLE:=y/ECM_INTERFACE_BOND_ENABLE:=n/g' Makefile
          sed -i 's/ECM_INTERFACE_BOND_ENABLE ?= y/ECM_INTERFACE_BOND_ENABLE ?= n/g' Makefile
          sed -i 's/ECM_INTERFACE_BOND_ENABLE ?=y/ECM_INTERFACE_BOND_ENABLE ?=n/g' Makefile
          echo "===== 修改后 ====="
          grep -n "ECM_INTERFACE_BOND_ENABLE" Makefile || true
          echo "✅ 已禁用 ECM bond 支持"
      # ==========================================

      - name: Generate .config
        run: |
          rm -f .config
          echo "CONFIG_TARGET_qualcommax=y" > .config
          echo "CONFIG_TARGET_qualcommax_ipq807x=y" >> .config
          echo "CONFIG_TARGET_MULTI_PROFILE=y" >> .config
          echo "CONFIG_TARGET_DEVICE_qualcommax_ipq807x_xiaomi_ax3600=y" >> .config

          echo "CONFIG_PACKAGE_kmod-qca-nss-drv=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qca-nss-ecm=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qca-nss-dp=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qca-nss-clients=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qca-nss-gmac=y" >> .config
          echo "CONFIG_PACKAGE_nss-firmware-ipq8074=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qca-nss-drv-bridge-mgr=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qca-nss-drv-vlan-mgr=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qca-nss-drv-igs=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qca-nss-drv-qdisc=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qca-ssdk=y" >> .config

          echo "CONFIG_PACKAGE_kmod-ath11k=y" >> .config
          echo "CONFIG_PACKAGE_kmod-ath11k-ahb=y" >> .config
          echo "CONFIG_PACKAGE_ath11k-firmware-ipq8074=y" >> .config
          echo "CONFIG_PACKAGE_ipq-wifi-xiaomi_ax3600=y" >> .config
          echo "CONFIG_PACKAGE_wpad-full=y" >> .config

          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-base=y" >> .config
          echo "CONFIG_PACKAGE_luci-mod-admin-full=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-package-manager=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y" >> .config

          echo "CONFIG_PACKAGE_sqm-scripts-nss=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-sqm=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-sqm-zh-cn=y" >> .config

          echo "CONFIG_PACKAGE_luci-app-nlbwmon=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-nlbwmon-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-statistics=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-statistics-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-watchcat=y" >> .config

          echo "CONFIG_PACKAGE_pppoe-diagnostic=y" >> .config
          echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
          echo "CONFIG_PACKAGE_dropbear=y" >> .config
          echo "CONFIG_PACKAGE_curl=y" >> .config
          echo "CONFIG_PACKAGE_wget-ssl=y" >> .config
          echo "CONFIG_PACKAGE_openssh-sftp-server=y" >> .config
          echo "CONFIG_PACKAGE_iperf3=y" >> .config
          echo "CONFIG_PACKAGE_htop=y" >> .config
          echo "CONFIG_PACKAGE_tcpdump=y" >> .config

          echo "CONFIG_PACKAGE_luci-app-store=y" >> .config
          echo "CONFIG_PACKAGE_taskd=y" >> .config
          echo "CONFIG_PACKAGE_luci-lib-taskd=y" >> .config
          echo "CONFIG_PACKAGE_luci-lib-xterm=y" >> .config
          echo "CONFIG_PACKAGE_luci-compat=y" >> .config

          echo "# CONFIG_PACKAGE_kmod-shortcut-fe is not set" >> .config
          echo "# CONFIG_PACKAGE_kmod-shortcut-fe-cm is not set" >> .config

          make defconfig

          sed -i 's/CONFIG_PACKAGE_kmod-shortcut-fe=y/# CONFIG_PACKAGE_kmod-shortcut-fe is not set/g' .config
          sed -i 's/CONFIG_PACKAGE_kmod-shortcut-fe-cm=y/# CONFIG_PACKAGE_kmod-shortcut-fe-cm is not set/g' .config

      - name: Print key config verification
        run: |
          echo "===== 校验 TARGET 与 NSS 配置 ====="
          grep -E "CONFIG_TARGET_DEVICE|kmod-qca-nss|shortcut-fe|kmod-ath11k" .config

      - name: Compile firmware
        run: make -j2 V=s 2>&1 | tee build.log

      - name: Print firmware file size
        run: |
          ls -lh bin/targets/qualcommax/ipq807x/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: AX3600-Qosmio-2410-nss-BIGPART-NSS-iStore
          path: |
            bin/targets/qualcommax/ipq807x/openwrt-qualcommax-ipq807x-xiaomi_ax3600-squashfs-factory.ubi
            bin/targets/qualcommax/ipq807x/openwrt-qualcommax-ipq807x-xiaomi_ax3600-squashfs-sysupgrade.bin
            build.log
